name: Capstone CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build and test application
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build vote production image
        run: docker build --target final -t voting-app-vote:test ./vote

      - name: Build result image
        run: docker build -t voting-app-result:test ./result

      - name: Build worker image
        run: docker build -t voting-app-worker:test ./worker

      - name: Start application dependencies
        run: docker compose up -d redis db

      - name: Start application services
        run: docker compose up -d --build vote result worker

      - name: Wait for application services
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/ >/dev/null &&
               curl -fsS http://localhost:8081/ >/dev/null; then
              echo "Vote and result services are responding."
              exit 0
            fi

            sleep 2
          done

          echo "FAIL: Application services did not become ready."
          docker compose ps
          docker compose logs
          exit 1

      - name: Submit a test vote and verify it is stored
        run: |
          before=""

          for _ in $(seq 1 30); do
            before=$(docker compose exec -T db psql -U postgres -d postgres -tAc "SELECT COUNT(*) FROM votes;" 2>/dev/null) || before=""

            if [[ "$before" =~ ^[0-9]+$ ]]; then
              break
            fi

            sleep 2
          done

          if ! [[ "$before" =~ ^[0-9]+$ ]]; then
            echo "FAIL: Could not read the votes table."
            docker compose logs
            exit 1
          fi

          echo "Votes before test: $before"

          if ! curl -fsS -X POST --data "vote=b" http://localhost:8080/ >/dev/null; then
            echo "FAIL: Could not submit the test vote."
            docker compose logs
            exit 1
          fi

          for _ in $(seq 1 30); do
            current=$(docker compose exec -T db psql -U postgres -d postgres -tAc "SELECT COUNT(*) FROM votes;" 2>/dev/null) || current=""

            if [[ "$current" =~ ^[0-9]+$ ]] && [ "$current" -gt "$before" ]; then
              echo "PASS: The test vote was recorded in PostgreSQL."
              exit 0
            fi

            sleep 2
          done

          echo "FAIL: The vote was not recorded in PostgreSQL."
          docker compose logs
          exit 1

      - name: Shut down test services
        if: always()
        run: docker compose down

  scan-images:
    name: Scan images with Trivy
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build images for scanning
        run: |
          docker build --target final -t voting-app-vote:${{ github.sha }} ./vote
          docker build -t voting-app-result:${{ github.sha }} ./result
          docker build -t voting-app-worker:${{ github.sha }} ./worker

      - name: Scan vote image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: voting-app-vote:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan result image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: voting-app-result:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan worker image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: voting-app-worker:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  publish-images:
    name: Publish images to GHCR
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - scan-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push vote image
        uses: docker/build-push-action@v6
        with:
          context: ./vote
          target: final
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/example-voting-app-vote:${{ github.sha }}

      - name: Build and push result image
        uses: docker/build-push-action@v6
        with:
          context: ./result
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/example-voting-app-result:${{ github.sha }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/example-voting-app-worker:${{ github.sha }}

  deploy-to-eks:
    name: Verify AWS OIDC and EKS API access
    runs-on: ubuntu-latest
    needs: publish-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::885069198277:role/GitHubActionsVotingAppDeployRole
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Configure EKS access
        run: aws eks update-kubeconfig --name voting-app-eks --region us-east-1

      - name: Verify Kubernetes API connectivity and permissions
        run: |
          echo "Checking whether this runner can reach the EKS Kubernetes API..."
          if ! kubectl get nodes; then
            echo "::error::AWS OIDC succeeded, but Kubernetes API access failed. Check the EKS public endpoint CIDR allowlist, runner network access, and Kubernetes role mapping. No application resources were changed."
            exit 1
          fi

          echo "Checking whether this identity can inspect the Helm release..."
          if ! helm list --namespace default; then
            echo "::error::Kubernetes API is reachable, but Helm/Kubernetes permissions are insufficient. No application resources were changed."
            exit 1
          fi
