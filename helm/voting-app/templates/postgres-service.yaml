
apiVersion: v1
kind: Service
metadata:
  name: db
  labels:
    app.kubernetes.io/name: voting-app
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: postgres
      protocol: TCP
  selector:
    app.kubernetes.io/name: voting-app
    app.kubernetes.io/component: postgres
